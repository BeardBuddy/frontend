name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          # Restores and saves ~/.npm keyed on package-lock.json.
          cache: npm

      - run: npm ci

      - name: Lint and typecheck
        run: |
          npx tsc --noEmit
          npx eslint app components lib common

      # No NEXT_PUBLIC_API_BASE_URL: the base URL is resolved at request time by
      # /api/config, so this artifact is environment-agnostic.
      - name: Build
        run: npm run build

      - name: Upload standalone build
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next/standalone
            .next/static
            public
          retention-days: 1
          include-hidden-files: true

  docker:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/huy'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download standalone build
        uses: actions/download-artifact@v4
        with:
          name: next-build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
